[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voiceforge-omnivoice-service"
version = "0.2.1"
description = "VoiceForge OmniVoice 2.0 Speech Inference Service"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "omnivoice>=0.2.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]
