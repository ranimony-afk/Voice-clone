# Local integration topology. The DB/Redis/object store scaffolding is present,
# but not all routes are wired to these services yet. Neural profile requires a GPU host.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voiceforge
      POSTGRES_USER: voiceforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceforge -d voiceforge"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes: ["miniodata:/data"]
    ports: ["9000:9000", "9001:9001"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://voiceforge:${POSTGRES_PASSWORD}@postgres:5432/voiceforge
      OMNIVOICE_SERVICE_URL: http://omnivoice:8100
      VOICEFORGE_WORKER_API_KEY: ${VOICEFORGE_WORKER_API_KEY:?Set VOICEFORGE_WORKER_API_KEY in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Do not expose API directly in production without auth/TLS/reverse proxy.

  omnivoice:
    profiles: ["gpu"]
    build:
      context: services/omnivoice
      dockerfile: Dockerfile.gpu
    environment:
      OMNIVOICE_DEVICE: cuda:0
      VOICEFORGE_CORS_ORIGINS: ${VOICEFORGE_CORS_ORIGINS:-}
      VOICEFORGE_WORKER_API_KEY: ${VOICEFORGE_WORKER_API_KEY:?Set VOICEFORGE_WORKER_API_KEY in .env}
      NODE_ENV: production
      HF_TOKEN: ${HF_TOKEN:?Set HF_TOKEN after accepting and recording model licenses}
    expose: ["8100"]
    volumes: ["modelcache:/models"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  pgdata:
  redisdata:
  miniodata:
  modelcache:
