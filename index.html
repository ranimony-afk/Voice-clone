<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoiceForge AI Voice Platform</title>
    <meta name="description" content="Production-grade multilingual AI voice platform featuring expressive TTS, zero-shot voice cloning, and text front-ends for English, Tamil, Hindi, Malayalam, and Japanese." />
    <meta property="og:title" content="VoiceForge AI Voice Platform" />
    <meta property="og:description" content="Production-grade multilingual AI voice platform featuring expressive TTS, zero-shot voice cloning, and text front-ends for English, Tamil, Hindi, Malayalam, and Japanese." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Multilingual Web Fonts for English, Hindi (Devanagari), Tamil, Malayalam, and Japanese -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Per AI Studio runtime constraints: HMR is disabled, ignore WebSocket errors
      window.addEventListener('error', function(event) {
        if (event.message && (event.message.includes('WebSocket') || event.message.includes('@vite/client'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        var str = String(event.reason && (event.reason.message || event.reason.stack || event.reason) || '');
        if (str.includes('WebSocket') || str.includes('@vite/client')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
