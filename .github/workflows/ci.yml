name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: Frontend + API (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  omnivoice-adapter:
    name: OmniVoice adapter (CPU, mocked model only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/omnivoice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/omnivoice/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest tests -q

  gpu-integration:
    name: Genuine OmniVoice GPU integration (manual only)
    if: github.event_name == 'workflow_dispatch' && vars.OMNIVOICE_GPU_RUNNER == 'true' && vars.MODEL_LICENSES_APPROVED == 'true'
    runs-on: [self-hosted, linux, x64, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require captured model license evidence
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN"
          python -m pip install -r services/omnivoice/requirements.lock
          python -m pip install 'omnivoice==0.2.1'
      - name: GPU synthesis smoke (weights downloaded from Hugging Face)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OMNIVOICE_DEVICE: cuda:0
          OMNIVOICE_MODEL_ID: k2-fsa/OmniVoice
        run: |
          cd services/omnivoice
          python -m app.main &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 120); do curl -fsS http://127.0.0.1:8100/healthz && break || sleep 1; done
          curl -fsS -X POST http://127.0.0.1:8100/v1/model/warmup
          python - <<'PY'
          import base64, json, urllib.request, wave, io
          req = urllib.request.Request(
              'http://127.0.0.1:8100/v1/tts',
              data=json.dumps({'text':'VoiceForge neural inference smoke test.','language':'en','num_step':8}).encode(),
              headers={'Content-Type':'application/json'},
          )
          with urllib.request.urlopen(req, timeout=300) as response:
              result=json.load(response)
          assert result['engine']=='omnivoice' and result['engine_class']=='neural'
          wav_bytes=base64.b64decode(result['audio_base64'])
          with wave.open(io.BytesIO(wav_bytes),'rb') as audio:
              assert audio.getnframes()>0 and audio.getframerate()==result['sample_rate']
          print({'engine':result['engine'],'sample_rate':result['sample_rate'],'duration_seconds':result['duration_seconds'],'wav_frames':audio.getnframes()})
          PY
